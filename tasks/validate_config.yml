---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please rename the variable (`{{ item.old }}` -> `{{ item.new }}`) on your configuration file (vars.yml).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "hubsite_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required Hubsite settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - hubsite_uid
    - hubsite_gid
    - hubsite_container_network
    - hubsite_title
    - hubsite_subtitle

- name: Run if Traefik is enabled
  when: hubsite_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for Hubsite are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "hubsite_container_labels_traefik_hostname", when: true }
        - { "name": "hubsite_container_labels_traefik_path_prefix", when: true }
        - { "name": "hubsite_container_labels_traefik_middleware_basic_auth_users", when: "{{ hubsite_container_labels_traefik_middleware_basic_auth_enabled }}" }
