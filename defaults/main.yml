---

hubsite_identifier: hubsite

hubsite_enabled: true
hubsite_base_path: "/hubsite"
# Folder containing hubsite's data, this folder will be your main data storage and must be on a large storage (e.g. large HDD)
hubsite_html_path: "{{ hubsite_base_path }}/html"
hubsite_assets_path: "{{ hubsite_html_path }}/assets"

# The hostname at which Hubsite is served.
hubsite_hostname: ""

# The path at which Hubsite is served.
hubsite_subpath: "/"

# renovate: datasource=docker depName=joseluisq/static-web-server versioning=semver
hubsite_static_web_server_version: 2.44.3

hubsite_container_image: "{{ hubsite_container_image_registry_prefix }}joseluisq/static-web-server:{{ hubsite_container_image_tag }}"
hubsite_container_image_tag: "{{ hubsite_static_web_server_version }}"
hubsite_container_image_registry_prefix: "{{ hubsite_container_image_registry_prefix_upstream }}"
hubsite_container_image_registry_prefix_upstream: "{{ hubsite_container_image_registry_prefix_upstream_default }}"
hubsite_container_image_registry_prefix_upstream_default: docker.io/
# TODO: re-add tasks to self-build the image

# The base container network. It will be auto-created by this role if it doesn't exist already.
hubsite_container_network: "{{ hubsite_identifier }}"

# Control if the container network is deleted on uninstalling.
hubsite_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `hubsite_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
hubsite_container_http_host_bind_port: ""

# The port number in the container
hubsite_container_http_port: 8080

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to a reverse proxy, which runs in a different container network.
hubsite_container_additional_networks: "{{ hubsite_container_additional_networks_auto + hubsite_container_additional_networks_custom }}"
hubsite_container_additional_networks_auto: []
hubsite_container_additional_networks_custom: []

# hubsite_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `hubsite_container_labels_additional_labels_custom`.
hubsite_container_labels_traefik_enabled: true
hubsite_container_labels_traefik_docker_network: "{{ hubsite_container_network }}"
hubsite_container_labels_traefik_hostname: "{{ hubsite_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/static-web-server`).
hubsite_container_labels_traefik_path_prefix: "{{ hubsite_path_prefix }}"
hubsite_container_labels_traefik_rule: "Host(`{{ hubsite_container_labels_traefik_hostname }}`){% if hubsite_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ hubsite_container_labels_traefik_path_prefix }}`){% endif %}"
hubsite_container_labels_traefik_priority: 0
hubsite_container_labels_traefik_entrypoints: web-secure
hubsite_container_labels_traefik_tls: "{{ hubsite_container_labels_traefik_entrypoints != 'web' }}"
hubsite_container_labels_traefik_tls_certResolver: default  # noqa var-naming
hubsite_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
hubsite_container_labels_traefik_middleware_basic_auth_users: ""

# Controls if labels are added to expose the Prometheus metrics publicly.
hubsite_container_labels_traefik_metrics_enabled: "{{ hubsite_environment_variables_server_metrics }}"
hubsite_container_labels_traefik_metrics_hostname: "{{ hubsite_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/metrics`).
hubsite_container_labels_traefik_metrics_path_prefix: /metrics
hubsite_container_labels_traefik_metrics_rule: "Host(`{{ hubsite_container_labels_traefik_metrics_hostname }}`){% if hubsite_container_labels_traefik_metrics_path_prefix != '/' %} && PathPrefix(`{{ hubsite_container_labels_traefik_metrics_path_prefix }}`){% endif %}"
hubsite_container_labels_traefik_metrics_priority: 0
hubsite_container_labels_traefik_metrics_entrypoints: "{{ hubsite_container_labels_traefik_entrypoints }}"
hubsite_container_labels_traefik_metrics_middlewares: []
hubsite_container_labels_traefik_metrics_tls: "{{ hubsite_container_labels_traefik_metrics_entrypoints != 'web' }}"
hubsite_container_labels_traefik_metrics_tls_certResolver: "{{ hubsite_container_labels_traefik_tls_certResolver }}"  # noqa var-naming
hubsite_container_labels_traefik_metrics_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
hubsite_container_labels_traefik_metrics_middleware_basic_auth_users: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `hubsite_container_labels_traefik_additional_request_headers_custom`
hubsite_container_labels_traefik_additional_request_headers: "{{ hubsite_container_labels_traefik_additional_request_headers_auto | combine(hubsite_container_labels_traefik_additional_request_headers_custom) }}"
hubsite_container_labels_traefik_additional_request_headers_auto: {}
hubsite_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `hubsite_container_labels_traefik_additional_response_headers_custom`
hubsite_container_labels_traefik_additional_response_headers: "{{ hubsite_container_labels_traefik_additional_response_headers_auto | combine(hubsite_container_labels_traefik_additional_response_headers_custom) }}"
hubsite_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': hubsite_http_header_xss_protection} if hubsite_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': hubsite_http_header_content_type_options} if hubsite_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': hubsite_http_header_content_security_policy} if hubsite_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': hubsite_http_header_permissions_policy} if hubsite_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': hubsite_http_header_strict_transport_security} if hubsite_http_header_strict_transport_security and hubsite_container_labels_traefik_tls else {})
  }}
hubsite_container_labels_traefik_additional_response_headers_custom: {}

# hubsite_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `hubsite_container_labels_additional_labels_custom`
#
# Example:
# hubsite_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
hubsite_container_labels_additional_labels: "{{ hubsite_container_labels_additional_labels_auto + hubsite_container_labels_additional_labels_custom }}"
hubsite_container_labels_additional_labels_auto: []
hubsite_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
hubsite_container_extra_arguments: "{{ hubsite_container_extra_arguments_auto + hubsite_container_extra_arguments_custom }}"
hubsite_container_extra_arguments_auto: []
hubsite_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container
# Example: ['--SOME_ARGUMENT']
hubsite_process_extra_arguments: "{{ hubsite_process_extra_arguments_auto + hubsite_process_extra_arguments_custom }}"
hubsite_process_extra_arguments_auto: []
hubsite_process_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
hubsite_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
hubsite_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
hubsite_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
hubsite_http_header_permissions_policy: "{{ 'interest-cohort=()' if hubsite_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
hubsite_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if hubsite_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `hubsite_http_header_permissions_policy`
hubsite_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `hubsite_http_header_strict_transport_security`
hubsite_hsts_preload_enabled: false

# List of systemd services that the Hubsite systemd service depends on
hubsite_systemd_required_services_list: "{{ hubsite_systemd_required_services_list_default + hubsite_systemd_required_services_list_auto + hubsite_systemd_required_services_list_custom }}"
hubsite_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
hubsite_systemd_required_services_list_auto: []
hubsite_systemd_required_services_list_custom: []

# List of systemd services that the Hubsite systemd service wants
hubsite_systemd_wanted_services_list: "{{ hubsite_systemd_wanted_services_list_default + hubsite_systemd_wanted_services_list_auto + hubsite_systemd_wanted_services_list_custom }}"
hubsite_systemd_wanted_services_list_default: []
hubsite_systemd_wanted_services_list_auto: []
hubsite_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
hubsite_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
hubsite_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
hubsite_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
hubsite_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ hubsite_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ hubsite_container_stop_grace_time_seconds }} {{ hubsite_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ hubsite_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ hubsite_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ hubsite_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ hubsite_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ hubsite_identifier }} after {{ hubsite_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

hubsite_service_list_auto: []
hubsite_service_list_additional: []
hubsite_service_list: "{{ hubsite_service_list_auto + hubsite_service_list_additional }}"

hubsite_title: ""

hubsite_subtitle: ""

hubsite_extra_css: ""

# Specify the timezone
hubsite_environment_variables_tz: UTC

# Specify a logging level
# Valid values: debug, error, info, trace, warn
hubsite_environment_variables_server_log_level: info

hubsite_environment_variables_server_root: /public

# Control if the /metrics endpoint that exposes Prometheus metrics is enabled
hubsite_environment_variables_server_metrics: false

# Additional environment variables.
hubsite_environment_variables_additional_variables: ""

# hubsite_restart_necessary controls whether the Hubsite systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
hubsite_restart_necessary: false
