---
- name: Prepare Hubsite Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Hubsite Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    # The `community.docker` modules that the role uses to pull the container
    # image and to create the container network talk to the Docker daemon
    # through `requests`, and refuse to run without it.
    - name: Ensure required packages are installed for Hubsite Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
        state: present

    - name: Ensure Docker is installed for Hubsite Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: vfs
