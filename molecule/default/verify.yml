---
- name: Verify Hubsite
  hosts: all
  become: true
  gather_facts: false

  vars:
    hubsite_verify_units:
      - hubsite.service

  tasks:
    - name: Verify that Hubsite works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: hubsite_defaults

        - name: Wait for the Hubsite systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: hubsite_services
          until: hubsite_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ hubsite_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Hubsite systemd services are active
          ansible.builtin.assert:
            that: hubsite_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(hubsite_verify_units | zip(hubsite_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Hubsite systemd services log for debugging
          when: hubsite_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ hubsite_verify_units }}"

        - name: Wait for the Hubsite page to be served (up to 180s)
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ hubsite_molecule_http_bind_port }}/"
            method: GET
            # Nothing about a working Hubsite involves a redirect, so following one
            # could only turn some other response into a misleading 200.
            follow_redirects: none
            return_content: true
          register: hubsite_page
          until: hubsite_page.status == 200
          retries: 36
          delay: 5

        # Hubsite is a static site served by the official nginx container image, so
        # the nginx version this role installs is the version of the thing being
        # tested. nginx announces it in the `Server` response header (it ships with
        # `server_tokens on`), which is the only version this deployment exposes.
        - name: Assert the serving nginx is the version this role installs
          ansible.builtin.assert:
            that: hubsite_page.server == 'nginx/' ~ hubsite_defaults.hubsite_nginx_version
            fail_msg: "Hubsite is served by {{ hubsite_page.server }}, expected nginx/{{ hubsite_defaults.hubsite_nginx_version }}"
            success_msg: "Hubsite is served by {{ hubsite_page.server }}"

        # A bare nginx container answers `/` with a 200 and its own welcome page,
        # so the status code above says nothing about this role. These assertions
        # are what separates the two: the page can only carry the configured
        # headings and service entries if the role rendered its own template and
        # nginx is serving that rendering.
        - name: Assert the Hubsite page carries the configured headings
          ansible.builtin.assert:
            that:
              - "'<title>' ~ hubsite_title ~ '</title>' in hubsite_page.content"
              - "'<strong>' ~ hubsite_title ~ '</strong>' in hubsite_page.content"
              - "'<p>' ~ hubsite_subtitle ~ '</p>' in hubsite_page.content"
            fail_msg: "The served page does not carry the configured title/subtitle: {{ hubsite_page.content }}"
            success_msg: "The served page carries the configured title and subtitle"

        - name: Assert the Hubsite page carries the configured service entries
          ansible.builtin.assert:
            that:
              - "'href=\"' ~ item.url ~ '\"' in hubsite_page.content"
              - "item.name in hubsite_page.content"
              - "item.description in hubsite_page.content"
            fail_msg: "The served page does not carry the {{ item.name }} entry: {{ hubsite_page.content }}"
            success_msg: "The served page carries the {{ item.name }} entry"
          loop: "{{ hubsite_service_list_additional }}"
          loop_control:
            label: "{{ item.name }}"

        # The page template only emits an `<img>` for entries that were given a
        # logo, and the role separately copies that logo into the assets directory.
        - name: Assert the Hubsite page links the logo of the entry that has one
          ansible.builtin.assert:
            that: "'src=\"assets/shield.png\"' in hubsite_page.content"
            fail_msg: "The served page does not link the configured logo: {{ hubsite_page.content }}"
            success_msg: "The served page links the configured logo"

        - name: Assert the Hubsite page emits no logo for the entry that has none
          ansible.builtin.assert:
            that: "'<h2>Molecule Service Without Logo</h2>' in hubsite_page.content"
            fail_msg: "The logo-less entry was not rendered without an image: {{ hubsite_page.content }}"
            success_msg: "The logo-less entry was rendered without an image"

        - name: Assert the Hubsite page orders service entries by priority
          ansible.builtin.assert:
            that: >-
              hubsite_page.content.index('Molecule Service With Logo')
              < hubsite_page.content.index('Molecule Service Without Logo')
            fail_msg: "The service entries are not ordered by priority: {{ hubsite_page.content }}"
            success_msg: "The service entries are ordered by priority"

        # Assets are served out of the same directory as the page, and a bare nginx
        # container answers both of these with a 404.
        - name: Fetch the Hubsite files that the page references
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ hubsite_molecule_http_bind_port }}{{ item }}"
            method: GET
            follow_redirects: none
          register: hubsite_referenced_files
          loop:
            - /styles.css
            - /assets/shield.png

        - name: Assert the Hubsite files that the page references are served
          ansible.builtin.assert:
            that: item.status == 200
            fail_msg: "{{ item.item }} is not served ({{ item.status }})"
            success_msg: "{{ item.item }} is served"
          loop: "{{ hubsite_referenced_files.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "hubsite_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: hubsite_restarts_before
              loop: "{{ hubsite_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: hubsite_restarts_after
              loop: "{{ hubsite_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - hubsite_restarts_after.results | map(attribute='status.NRestarts') | list == hubsite_restarts_before.results | map(attribute='status.NRestarts') | list
                  - hubsite_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in hubsite_verify_units | zip(hubsite_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in hubsite_verify_units | zip(hubsite_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in hubsite_verify_units | zip(hubsite_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Hubsite verification summary
          ansible.builtin.debug:
            msg:
              - "Hubsite systemd: {% for unit, state in hubsite_verify_units | zip(hubsite_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Hubsite restarts: {% for unit, restarts in hubsite_verify_units | zip(hubsite_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Hubsite server: {{ hubsite_page.server }}"
              - "Hubsite page size: {{ hubsite_page.content | length }} bytes"
              - "Hubsite service entries: {{ hubsite_service_list_additional | map(attribute='name') | join(', ') }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Hubsite systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=hubsite.service
          register: hubsite_service_log
          changed_when: false

        - name: Show the Hubsite systemd service log
          ansible.builtin.debug:
            var: hubsite_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Hubsite verification failed. The systemd service log is printed above."
